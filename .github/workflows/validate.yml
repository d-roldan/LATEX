name: Validación
on:
  pull_request:
  push:
    branches: [main]
    tags: ["V*.*.*"]
permissions:
  contents: read
jobs:
  alcance:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      prisma: ${{ steps.paths.outputs.prisma }}
      e2e: ${{ steps.paths.outputs.e2e }}
      infra: ${{ steps.paths.outputs.infra }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff y rutas
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [[ -n "$previous_tag" ]]; then
              BASE_SHA=$(git rev-parse "$previous_tag^{commit}")
            else
              BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            fi
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
            echo 'prisma=true' >> "$GITHUB_OUTPUT"
            echo 'e2e=true' >> "$GITHUB_OUTPUT"
            echo 'infra=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed.txt
            if grep -Eq '^apps/backend/' changed.txt; then echo 'backend=true' >> "$GITHUB_OUTPUT"; fi
            if grep -Eq '^apps/frontend/' changed.txt; then echo 'frontend=true' >> "$GITHUB_OUTPUT"; fi
            if grep -Eq '^apps/backend/prisma/' changed.txt; then echo 'prisma=true' >> "$GITHUB_OUTPUT"; fi
            if grep -Eq '^e2e/' changed.txt; then echo 'e2e=true' >> "$GITHUB_OUTPUT"; fi
            if grep -Eq '^(docker-compose\.yml|infra/nginx/|\.env\.example)' changed.txt; then echo 'infra=true' >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Obtener objeto del tag anotado
        if: github.ref_type == 'tag'
        shell: bash
        run: git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: Verificar tag y notas
        if: github.ref_type == 'tag'
        run: node scripts/verify-release.mjs "$GITHUB_REF_NAME"
  backend:
    needs: alcance
    if: needs.alcance.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: apps/backend
      - run: npm run prisma:generate
        working-directory: apps/backend
      - name: Lint de archivos TypeScript modificados
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
          BASE_SHA: ${{ needs.alcance.outputs.base_sha }}
        shell: bash
        run: |
          mapfile -t files < <(git diff --diff-filter=ACMR --name-only "$BASE_SHA" "$GITHUB_SHA" -- apps/backend | grep -E '^apps/backend/(src|prisma)/.*\.ts$' | sed 's#^apps/backend/##' || true)
          if ((${#files[@]})); then
            cd apps/backend
            npx --no-install eslint "${files[@]}"
          fi
      - run: npm run build
        working-directory: apps/backend
      - run: npm test -- --runInBand
        working-directory: apps/backend
      - name: Prisma y migraciones
        if: needs.alcance.outputs.prisma == 'true'
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          npx --no-install prisma validate
          if find prisma/migrations -name migration.sql -empty -print -quit | grep -q .; then exit 1; fi
  frontend:
    needs: alcance
    if: needs.alcance.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run lint
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
        working-directory: apps/frontend
      - run: npm run build
        working-directory: apps/frontend
  e2e-config:
    needs: alcance
    if: needs.alcance.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npm run test:list
        working-directory: e2e
  compose:
    needs: alcance
    if: needs.alcance.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose --env-file .env.example config --quiet
