<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e30613" />
    <title>Sin conexión · DISAL</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #fff; background: radial-gradient(700px 420px at 70% -10%, rgba(59, 130, 246, 0.14), transparent 68%), linear-gradient(180deg, #0b0f19, #111827); }
      main { width: min(100%, 480px); padding: 32px; text-align: center; background: #151e2d; border: 1px solid #2b3a53; border-radius: 16px; box-shadow: 0 22px 46px -18px rgba(4, 8, 18, 0.72); }
      img { display: block; width: min(280px, 80%); height: auto; margin: 0 auto 24px; }
      h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 5vw, 2rem); }
      p { margin: 0 0 24px; color: #dbe5f5; line-height: 1.6; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 20px; color: #fff; font-weight: 700; text-decoration: none; background: #e72b35; border-radius: 8px; }
      a:focus-visible { outline: 3px solid #60a5fa; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/grupo-disal-logo.png" alt="Grupo DISAL" />
      <h1>Sin conexión</h1>
      <p>No se puede contactar al servidor de planta. Revisá la red local y volvé a intentar. Los datos operativos no se almacenan sin conexión.</p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
