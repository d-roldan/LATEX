limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ai_per_ip:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

server {
  listen 80;
  server_name disal-industria.local DISAL-industria _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name disal-industria.local DISAL-industria _;
  server_tokens off;

  ssl_certificate /etc/nginx/certs/disal-industria.local.crt;
  ssl_certificate_key /etc/nginx/certs/disal-industria.local.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 10m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  limit_req_status 429;
  limit_conn_status 429;

  location = /api/auth/login {
    limit_req zone=login_per_ip burst=5 nodelay;
    limit_conn connections_per_ip 10;
    set $backend_upstream http://disal-backend:3000;
    proxy_pass $backend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
  }

  location ^~ /api/ai-assistant/ {
    limit_req zone=ai_per_ip burst=4 nodelay;
    limit_conn connections_per_ip 5;
    set $backend_upstream http://disal-backend:3000;
    proxy_pass $backend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 75s;
  }

  location ^~ /api/uploads/ { return 404; }

  location /api/ {
    limit_req zone=api_per_ip burst=30 nodelay;
    limit_conn connections_per_ip 20;
    set $backend_upstream http://disal-backend:3000;
    proxy_pass $backend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
  }

  location / {
    set $frontend_upstream http://disal-frontend:80;
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
