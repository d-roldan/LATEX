services:
  disal-db:
    image: postgres:16-alpine
    container_name: disal-db
    restart: unless-stopped
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: ${DB_CPU_LIMIT:-1.5}
    pids_limit: 200
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  disal-uploads-init:
    image: nginx:1.27-alpine
    container_name: disal-uploads-init
    restart: "no"
    user: "0:0"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    command: [ "sh", "-c", "if [ \"$(stat -c %u:%g /uploads)\" != \"1000:1000\" ]; then chown -R 1000:1000 /uploads; fi && chmod 0750 /uploads" ]
    volumes:
      - uploads_data:/uploads

  disal-backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: disal-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${BACKEND_MEMORY_LIMIT:-512m}
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
    pids_limit: 200
    depends_on:
      disal-db:
        condition: service_healthy
      disal-uploads-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV}
      TZ: ${TZ}
      BACKEND_PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${DISAL_OPENAI_API_KEY:-}}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SYSTEM_OWNER_COMPANY_ID: ${SYSTEM_OWNER_COMPANY_ID}
      SYSTEM_OWNER_USERNAME: ${SYSTEM_OWNER_USERNAME}
      SYSTEM_OWNER_FULL_NAME: ${SYSTEM_OWNER_FULL_NAME}
      SYSTEM_OWNER_PASSWORD: ${SYSTEM_OWNER_PASSWORD}
      NODE_RED_API_KEY: ${NODE_RED_API_KEY}
    volumes:
      - uploads_data:/app/data/uploads
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/auth/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  disal-frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: disal-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  disal-nginx:
    image: nginx:1.27-alpine
    container_name: disal-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: ${NGINX_MEMORY_LIMIT:-128m}
    cpus: ${NGINX_CPU_LIMIT:-0.5}
    pids_limit: 100
    depends_on:
      disal-backend:
        condition: service_started
      disal-frontend:
        condition: service_started
    ports:
      - "0.0.0.0:${HTTP_PORT}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  disal-node-red:
    image: nodered/node-red:4.0.9
    container_name: disal-node-red
    restart: unless-stopped
    mem_limit: ${NODE_RED_MEMORY_LIMIT:-256m}
    cpus: ${NODE_RED_CPU_LIMIT:-0.5}
    pids_limit: 150
    depends_on:
      disal-nginx:
        condition: service_started
    environment:
      TZ: ${TZ}
      NODE_RED_API_KEY: ${NODE_RED_API_KEY}
    ports:
      - "127.0.0.1:${NODE_RED_PORT:-1880}:1880"
    volumes:
      - ./infra/node-red/data:/data

volumes:
  postgres_data:
  uploads_data:
